<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reembolsos Ferbera (Prototipo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { background-color: #f3f4f6; border-color: #10b981; border-bottom: none; color: #10b981; font-weight: bold;}
        .tab-inactive { background-color: #ffffff; border-color: #d1d5db; color: #6b7280; }
        .hidden-view { display: none; }
    </style>
</head>
<body class="bg-gray-50 p-8 font-sans text-gray-800">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-2">Reembolsos Ferbera (prototipo)</h1>
        <p class="text-sm text-gray-500 mb-6">Prototipo del flujo digital. Elige un rol para ver cada paso; los datos viven solo en esta página.</p>

        <!-- Pestañas de Roles -->
        <div class="flex space-x-2 mb-4 border-b border-gray-300">
            <button onclick="switchTab('solicitante')" id="tab-solicitante" class="tab-active px-6 py-2 border border-b-0 rounded-t-lg transition-colors">Solicitante</button>
            <button onclick="switchTab('aprobador')" id="tab-aprobador" class="tab-inactive px-6 py-2 border border-b-0 rounded-t-lg transition-colors">Aprobador</button>
            <button id="tab-cuentas" class="tab-inactive px-6 py-2 border border-b-0 rounded-t-lg opacity-50 cursor-not-allowed text-sm">Cuentas por pagar</button>
        </div>

        <!-- VISTA: Solicitante -->
        <div id="view-solicitante" class="bg-white border border-gray-300 rounded-lg p-6 shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Nuevo reembolso</h2>
            
            <form id="reembolso-form">
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Solicitante</label>
                        <input type="text" id="nombre" placeholder="Tu nombre (de la cuenta Microsoft 365)" required class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Área o centro de costos</label>
                        <select id="area" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option>Cuentas por pagar</option>
                            <option>Ventas</option>
                            <option>Compras</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Moneda</label>
                        <select id="moneda" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50">
                            <option>MXN</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Forma de pago</label>
                        <select id="forma_pago" class="w-full border border-gray-300 rounded p-2 text-sm">
                            <option>Transferencia</option>
                        </select>
                    </div>
                </div>

                <h3 class="text-md font-semibold mb-3 text-gray-700">Gastos incluidos</h3>
                <div id="gastos-container" class="space-y-4">
                    <!-- Los gastos se inyectan aquí vía JS -->
                </div>

                <button type="button" onclick="agregarGasto()" class="mt-4 px-4 py-2 border border-gray-300 rounded text-sm text-gray-700 hover:bg-gray-50">+ Agregar otro gasto</button>

                <div class="mt-6 flex justify-between items-center border-t pt-4">
                    <div class="text-xl font-bold text-gray-800" id="total-display">Total: $0.00</div>
                    <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded shadow hover:bg-emerald-700 transition">Enviar reembolso</button>
                </div>
            </form>
        </div>

        <!-- VISTA: Aprobador -->
        <div id="view-aprobador" class="hidden-view bg-white border border-gray-300 rounded-lg p-6 shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Mis reembolsos (Para Aprobar)</h2>
            <div id="lista-aprobaciones" class="space-y-4">
                <!-- Solicitudes inyectadas vía JS -->
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
